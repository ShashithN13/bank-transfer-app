spring.application.name=bank-transfer-app

# ---- MySQL connection (XAMPP defaults: user root, empty password) ----
# createDatabaseIfNotExist=true creates the database "bank_db" automatically
spring.config.import=optional:file:./secrets.properties
spring.datasource.url=jdbc:mysql://localhost:3306/bank_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=

# ---- JPA / Hibernate ----
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# ---- Thymeleaf ----
spring.thymeleaf.cache=false

# ---- Logging ----
logging.level.org.springframework.transaction.interceptor=TRACE
logging.level.org.springframework.orm.jpa.JpaTransactionManager=DEBUG

server.port=8081